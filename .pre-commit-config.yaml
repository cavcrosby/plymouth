---
files: |
  (?x)^(
    .github/workflows/sync-upstream.yml|
    scripts/build-pkgs|
    scripts/setup|
    scripts/sync-upstream
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: trailing-whitespace

  - repo: https://github.com/cavcrosby/shellcheck-precommit.git
    rev: v0.13.0
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write
        language: node
        types_or:
          - yaml
        additional_dependencies:
          - prettier@3.9.8
